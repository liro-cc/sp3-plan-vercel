<!doctype html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0e14">
<meta name="description" content="Plan lekcji SP3 Czerwionka-Leszczyny - zastępstwa, plan dnia, eksport do kalendarza">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<title>SP3 — Plan lekcji</title>
</head>
<body>

<div class="mobile-header">
  <div class="brand"><div class="mark">S3</div><div class="logo">SP3 Plan</div></div>
  <div class="mobile-actions">
    <button class="pick-btn" onclick="openPicker()" aria-label="Wybierz plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      Wybierz
    </button>
    <button class="refresh-btn-m" id="refreshBtnMobile" onclick="syncData()" aria-label="Odśwież dane">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6"/><path d="M2.5 22v-6h6"/><path d="M21.34 8A10 10 0 0 0 4 6l-1.5 2"/><path d="M2.66 16A10 10 0 0 0 20 18l1.5-2"/></svg>
    </button>
  </div>
</div>
<div class="mobile-current" id="mobileCurrent"></div>

<div class="picker-overlay" id="pickerOverlay" onclick="closePicker(event)">
  <div class="picker-sheet" onclick="event.stopPropagation()">
    <div class="picker-header">
      <h3>Wybierz plan</h3>
      <button class="picker-close" onclick="closePicker()" aria-label="Zamknij">&times;</button>
    </div>
    <div class="picker-search">
      <input type="text" id="pickerSearch" placeholder="Szukaj..." oninput="filterPicker()">
    </div>
    <div class="picker-tabs">
      <button class="active" onclick="switchPickerTab('classes',this)">Klasy</button>
      <button onclick="switchPickerTab('teachers',this)">Nauczyciele</button>
      <button onclick="switchPickerTab('rooms',this)">Sale</button>
    </div>
    <div class="picker-list" id="pickerList"></div>
  </div>
</div>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="active" onclick="switchMainView('today')" id="navTodayM">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Dziś
    </button>
    <button onclick="switchMainView('week')" id="navWeekM">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Tydzień
    </button>
    <button onclick="switchMainView('zastepstwa')" id="navZastM">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Zastępstwa
    </button>
  </div>
</nav>

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <div class="mark">S3</div>
      <div>
        <div class="logo">SP3 Plan Lekcji</div>
        <div class="sub">Czerwionka-Leszczyny</div>
      </div>
    </div>
    <div class="date-row">
      <div class="date-pill"><span class="dot"></span><span id="todayDate"></span></div>
      <div class="clock" id="liveClock"></div>
    </div>
  </div>

  <div class="countdown-wrap" id="countdownWrap">
    <div class="countdown-label" id="countdownLabel">Następna lekcja za</div>
    <div class="countdown-time" id="countdownTime">--:--</div>
    <div class="countdown-detail" id="countdownDetail"></div>
    <div class="countdown-progress"><div class="countdown-progress-bar" id="countdownBar" style="width:0%"></div></div>
  </div>

  <nav class="sidebar-nav">
    <button class="nav-btn active" onclick="switchMainView('today')" id="navToday">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Dziś <span class="kbd">1</span>
    </button>
    <button class="nav-btn" onclick="switchMainView('week')" id="navWeek">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Tydzień <span class="kbd">2</span>
    </button>
    <button class="nav-btn" onclick="switchMainView('zastepstwa')" id="navZast">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Zastępstwa <span class="kbd">3</span>
    </button>
  </nav>

  <div class="sidebar-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="sideSearch" placeholder="Szukaj ( / )..." oninput="filterSidebar()">
  </div>

  <div class="sidebar-list" id="sidebarList"></div>

  <div class="sidebar-footer">
    <div class="footer-row">
      <button class="theme-btn" onclick="toggleTheme()" title="Zmień motyw" aria-label="Zmień motyw">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="refresh-btn" id="refreshBtn" onclick="syncData()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6"/><path d="M2.5 22v-6h6"/><path d="M21.34 8A10 10 0 0 0 4 6l-1.5 2"/><path d="M2.66 16A10 10 0 0 0 20 18l1.5-2"/></svg>
        Odśwież dane
      </button>
    </div>
    <div class="last-sync" id="lastSync"></div>
  </div>
</aside>

<main class="main" id="mainArea">
  <div class="loading-screen">
    <div class="spinner"></div>
    <p>Ładowanie planu lekcji...</p>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
